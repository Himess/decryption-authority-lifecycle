[package]
name = "a5-native-verify"
version = "0.1.0"
edition = "2021"
publish = false
description = "A5 deliberation: native verification cost and Wycheproof cross-check for decryption-permit signers. Throwaway measurement code."

[dependencies]
# All crates below are UNAUDITED for this use (see MEASUREMENT_NOTES.txt).
ml-dsa = "=0.1.1"
fn-dsa = "=0.4.0"
slh-dsa = "=0.2.0-rc.5"
k256 = { version = "=0.13.4", features = ["ecdsa"] }
secp256k1 = { version = "=0.30.0", features = ["recovery"] }
sha3 = "0.10"
rand = "0.8"
serde_json = "1"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
