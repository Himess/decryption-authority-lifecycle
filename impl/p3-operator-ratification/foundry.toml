# Phase 4, P3: operator-ratified registry upgrades with on-chain ML-DSA-44 signatures (prototype).
# The verifier is vendored from fireblocks-labs/evm-ml-dsa-verifier at cca262b5 (MIT, unaudited) and compiled with
# that repository's own settings (solc 0.8.30, via-IR, 10,000 runs, osaka), on which its 1,226,311-gas figure rests.

[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["vendor"]
solc = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 10000
via_ir = true
bytecode_hash = "none"

[lint]
lint_on_build = false
