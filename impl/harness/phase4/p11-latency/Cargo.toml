[package]
name = "p11-latency"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Phase 4, P1.1: per-request signature-check latency of the KDA route, ECDSA and the ERC-1271 budget path, against a local anvil, with the Level 3 crate (lifecycle/level3-connector)."

# Standalone workspace: never join a parent workspace.
[workspace]

[dependencies]
# The Level 3 crate (zama-ai/fhevm main ed851716c + lifecycle/level3-connector), by path, with every K8 implementation.
user-decryption-signature = { path = "../../../wt-l3-conn/shared/user-decryption-signature", features = ["k8"] }
alloy = { version = "2", default-features = false, features = [
    "k256",
    "providers",
    "reqwest",
    "reqwest-native-tls",
    "rpc-types",
    "sol-types",
    "signer-local",
    "json-rpc",
] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "time"] }
