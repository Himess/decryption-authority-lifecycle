[package]
name = "udsig-h"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Phase 4 copy of the Level 1 udsig-h harness, bound to the lifecycle/level1 worktree (impl/wt-l1-h9): the Profile H entry point of user-decryption-signature and its unchanged verify_signature, against a local JSON-RPC node."

# Standalone workspace: never join a parent workspace.
[workspace]

[dependencies]
# The Level 1 crate (zama-ai/fhevm main ed851716c + lifecycle/level1), by path.
user-decryption-signature = { path = "../../../wt-l1-h9/shared/user-decryption-signature" }
fhevm_gateway_bindings = { path = "../../../wt-l1-h9/gateway-contracts/rust_bindings", default-features = false }

alloy = { version = "2", default-features = false, features = [
    "k256",
    "providers",
    "reqwest",
    "reqwest-native-tls",
    "rpc-types",
    "sol-types",
] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }
