# Phase 5, B0: a test post-quantum wallet (TEST ONLY, NOT AUDITED).
# The ML-DSA-44 verifier is the copy vendored for Phase 4 P3 (fireblocks-labs/evm-ml-dsa-verifier at cca262b5, MIT,
# unaudited), compiled with that repository's own settings (solc 0.8.30, via-IR, 10,000 runs, osaka), on which its
# gas figures rest. forge-std is the copy vendored for the Fhenix port (1.11.0).

[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = []
solc = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 10000
via_ir = true
bytecode_hash = "none"
remappings = [
  "mldsa/=../p3-operator-ratification/vendor/evm-ml-dsa-verifier-cca262b5/src/",
  "forge-std/=../fhenix-port/vendor/forge-std-1.11.0/src/",
]
allow_paths = ["../p3-operator-ratification/vendor", "../fhenix-port/vendor/forge-std-1.11.0"]
fs_permissions = [
  { access = "read", path = "./test/vectors" },
  { access = "read", path = "./out" },
  { access = "read", path = "../p3-operator-ratification/vendor/evm-ml-dsa-verifier-cca262b5/helpers" },
]

[lint]
lint_on_build = false
